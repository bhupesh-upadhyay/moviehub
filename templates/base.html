<!DOCTYPE html>
<html>
<head>
    <title>MovieHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body class="bg-gray-900 text-white">

<nav class="flex justify-between items-center px-6 py-4 bg-black">
    
    <!-- Logo -->
    <h1 class="text-xl font-bold">🎬 MovieHub</h1>

    <!-- Search -->
    <div class="w-1/2 relative">
        <input 
            type="text"
            name="q"
            placeholder="Search movies..."
            class="w-full p-2 rounded bg-gray-800"

            hx-get="/search/"
            hx-trigger="keyup changed delay:400ms"
            hx-target="#search-results"
        />

        <!-- Results dropdown -->
        <div 
            id="search-results" 
            class="absolute w-full bg-gray-800 mt-2 rounded shadow-lg z-50"
        ></div>
    </div>

    <!-- Right side -->
    <div class="space-x-4">
        {% if request.session.access_token %}
            <a href="/" class="hover:text-gray-400">Home</a>

            <a href="/auth/logout/" 
               class="bg-red-600 px-3 py-1 rounded hover:bg-red-700">
               Logout
            </a>
        {% else %}
            <a href="/auth/login/" class="hover:text-gray-400">Login</a>

            <a href="/auth/register/" 
               class="bg-green-600 px-3 py-1 rounded hover:bg-green-700">
               Register
            </a>
        {% endif %}
    </div>

</nav>

<div class="p-6">
    {% block content %}{% endblock %}
</div>

</body>
</html>
