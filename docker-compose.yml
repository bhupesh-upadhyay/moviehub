services:
  redis:
    image: redis:7
    container_name: moviehub-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    restart: unless-stopped

  postgres:
    image: postgres:15
    container_name: moviehub-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-moviehub}
      POSTGRES_USER: ${DB_USER:-moviehub_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-moviehub_pass}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # pgadmin:
  #   image: dpage/pgadmin4:latest
  #   container_name: moviehub-pgadmin
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: admin@moviehub.com
  #     PGADMIN_DEFAULT_PASSWORD: admin123
  #   ports:
  #     - "${PGADMIN_PORT:-8080}:80"
  #   volumes:
  #     - ./pgadmin_data:/var/lib/pgadmin
  #     # - ./pgadmin_config:/pgadmin4/servers.json
  #   restart: unless-stopped

  minio:
    image: minio/minio
    container_name: moviehub-minio
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-admin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-password123}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ./minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

