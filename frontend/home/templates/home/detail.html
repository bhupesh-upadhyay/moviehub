{% extends "base.html" %}

{% block content %}

<div class="flex gap-6">

    <img src="{{ movie.thumbnail }}" class="w-64 rounded"/>

    <div>
        <h1 class="text-3xl font-bold">{{ movie.title }}</h1>

        <p class="text-gray-400 mt-2">
            {{ movie.release_year }}
        </p>

        <p class="mt-4">
            {{ movie.description }}
        </p>

        <div class="mt-4">
            {% for genre in movie.genres %}
                <span class="bg-gray-700 px-2 py-1 rounded text-sm">
                    {{ genre }}
                </span>
            {% endfor %}
        </div>

    </div>

</div>

{% endblock %}
