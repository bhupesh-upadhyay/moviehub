{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto bg-gray-800 p-6 rounded-lg shadow-lg">
    <h2 class="text-2xl font-bold mb-4 text-center">Login</h2>

    <form method="POST" class="space-y-4">
        {% csrf_token %}
        
        <input 
            type="email" 
            name="email" 
            placeholder="Email"
            class="w-full p-2 rounded bg-gray-700"
        />

        <input 
            type="password" 
            name="password" 
            placeholder="Password"
            class="w-full p-2 rounded bg-gray-700"
        />

        <button 
            class="w-full bg-red-600 hover:bg-red-700 p-2 rounded"
        >
            Login
        </button>
    </form>

    <p class="mt-4 text-center">
        Don't have an account? 
        <a href="/auth/register/" class="text-blue-400">Register</a>
    </p>
</div>
{% endblock %}
