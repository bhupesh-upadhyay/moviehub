{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto bg-gray-800 p-6 rounded-lg shadow-lg">
    <h2 class="text-2xl font-bold mb-4 text-center">Register</h2>

    <form method="POST" class="space-y-4">
        {% csrf_token %}

        <input 
            type="email" 
            name="email" 
            placeholder="Email"
            class="w-full p-2 rounded bg-gray-700"
        />

        <input 
            type="text" 
            name="username" 
            placeholder="Username"
            class="w-full p-2 rounded bg-gray-700"
        />

        <input 
            type="password" 
            name="password" 
            placeholder="Password"
            class="w-full p-2 rounded bg-gray-700"
        />

        <button 
            class="w-full bg-green-600 hover:bg-green-700 p-2 rounded"
        >
            Register
        </button>
    </form>
</div>
{% endblock %}
